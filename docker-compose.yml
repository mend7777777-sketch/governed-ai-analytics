services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_analytics}
      MYSQL_USER: ${MYSQL_USER:-ai_analytics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_analytics}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MOCK_ORDERS: ${MOCK_ORDERS:-100000}
      MOCK_USERS: ${MOCK_USERS:-10000}
      MOCK_PRODUCTS: ${MOCK_PRODUCTS:-500}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in .env}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-平台管理员}
    command: ["python", "scripts/docker_seed.py"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_analytics}
      MYSQL_USER: ${MYSQL_USER:-ai_analytics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_POOL_ACQUIRE_TIMEOUT_SECONDS: ${DB_POOL_ACQUIRE_TIMEOUT_SECONDS:-10}
      MYSQL_CONNECT_TIMEOUT_SECONDS: ${MYSQL_CONNECT_TIMEOUT_SECONDS:-10}
      MYSQL_READ_TIMEOUT_SECONDS: ${MYSQL_READ_TIMEOUT_SECONDS:-35}
      MYSQL_WRITE_TIMEOUT_SECONDS: ${MYSQL_WRITE_TIMEOUT_SECONDS:-35}
      MYSQL_QUERY_TIMEOUT_MS: ${MYSQL_QUERY_TIMEOUT_MS:-30000}
      MYSQL_SSL_DISABLED: ${MYSQL_SSL_DISABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CHROMA_PATH: /app/storage/chroma_ai_analytics
    ports:
      - "8010:8010"
    volumes:
      - chroma_data:/app/storage/chroma_ai_analytics
      - api_logs:/app/logs
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/api/examples', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    restart: unless-stopped
    environment:
      ANALYTICS_API_URL: http://api:8010
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  chroma_data:
  api_logs:
